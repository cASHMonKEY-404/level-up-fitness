"312\" fill=\"#F7F5FA\" font-family=\"Inter,Arial,sans-serif\" font-size=\"14\" font-weight=\"400\"><tspan x=\"84\" dy=\"0\">Nutrition #DF43FF</tspan></text><rect x=\"24\" y=\"346\" width=\"44\" height=\"44\" rx=\"11\" fill=\"#4C9BFF\"/><text x=\"84\" y=\"373\" fill=\"#F7F5FA\" font-family=\"Inter,Arial,sans-serif\" font-size=\"14\" font-weight=\"400\"><tspan x=\"84\" dy=\"0\">Calories #4C9BFF</tspan></text><rect x=\"24\" y=\"407\" width=\"44\" height=\"44\" rx=\"11\" fill=\"#FFA21B\"/><text x=\"84\" y=\"434\" fill=\"#F7F5FA\" font-family=\"Inter,Arial,sans-serif\" font-size=\"14\" font-weight=\"400\"><tspan x=\"84\" dy=\"0\">Protein #FFA21B</tspan></text><rect x=\"24\" y=\"468\" width=\"44\" height=\"44\" rx=\"11\" fill=\"#76FF03\"/><text x=\"84\" y=\"495\" fill=\"#F7F5FA\" font-family=\"Inter,Arial,sans-serif\" font-size=\"14\" font-weight=\"400\"><tspan x=\"84\" dy=\"0\">Carbs #76FF03</tspan></text><rect x=\"24\" y=\"529\" width=\"44\" height=\"44\" rx=\"11\" fill=\"#F0DF00\"/><text x=\"84\" y=\"556\" fill=\"#F7F5FA\" font-family=\"Inter,Arial,sans-serif\" font-size=\"14\" font-weight=\"400\"><tspan x=\"84\" dy=\"0\">Fat #F0DF00</tspan></text><text x=\"24\" y=\"632\" fill=\"#B4ACBD\" font-family=\"Inter,Arial,sans-serif\" font-size=\"12\" font-weight=\"400\"><tspan x=\"24\" dy=\"0\">Inter: 28 page titles, 20\u201324 card titles, 14\u201316</tspan><tspan x=\"24\" dy=\"16.200000000000003\">body, 12 secondary. Two main weights: Regular and</tspan><tspan x=\"24\" dy=\"16.200000000000003\">SemiBold.</tspan></text><text x=\"24\" y=\"722\" fill=\"#B4ACBD\" font-family=\"Inter,Arial,sans-serif\" font-size=\"12\" font-weight=\"400\"><tspan x=\"24\" dy=\"0\">24 px side margins \u00b7 16 px card radius \u00b7 48 px</tspan><tspan x=\"24\" dy=\"16.200000000000003\">primary buttons \u00b7 44 px minimum touch target.</tspan></text></svg>", "review-notes": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"390\" height=\"844\" viewBox=\"0 0 390 844\"><title>Review &amp; implementation notes</title><rect width=\"390\" height=\"844\" fill=\"#080808\"/><text x=\"24\" y=\"31\" fill=\"#F7F5FA\" font-family=\"Inter,Arial,sans-serif\" font-size=\"14\" font-weight=\"600\"><tspan x=\"24\" dy=\"0\">9:41</tspan></text><text x=\"291\" y=\"29\" fill=\"#F7F5FA\" font-family=\"Inter,Arial,sans-serif\" font-size=\"12\" font-weight=\"400\"><tspan x=\"291\" dy=\"0\">\u2582 \u2584 \u2586 \u25b0</tspan></text><text x=\"24\" y=\"128\" fill=\"#F7F5FA\" font-family=\"Inter,Arial,sans-serif\" font-size=\"28\" font-weight=\"600\"><tspan x=\"24\" dy=\"0\">Review &amp;</tspan><tspan x=\"24\" dy=\"37.800000000000004\">implementation notes</tspan></text><rect x=\"135\" y=\"827\" width=\"120\" height=\"5\" rx=\"3\" fill=\"#E9E5EC\"/><text x=\"24\" y=\"179\" fill=\"#B4ACBD\" font-family=\"Inter,Arial,sans-serif\" font-size=\"15\" font-weight=\"400\"><tspan x=\"24\" dy=\"0\">All screen values are coherent sample</tspan><tspan x=\"24\" dy=\"20.25\">data, not the user\u2019s tracked records.</tspan></text><text x=\"24\" y=\"264\" fill=\"#B4ACBD\" font-family=\"Inter,Arial,sans-serif\" font-size=\"15\" font-weight=\"400\"><tspan x=\"24\" dy=\"0\">This is a clickable design prototype.</tspan><tspan x=\"24\" dy=\"20.25\">Fields and calculations become</tspan><tspan x=\"24\" dy=\"20.25\">interactive during implementation.</tspan></text><text x=\"24\" y=\"364\" fill=\"#B4ACBD\" font-family=\"Inter,Arial,sans-serif\" font-size=\"15\" font-weight=\"400\"><tspan x=\"24\" dy=\"0\">Preserve local workout, meal, step and XP</tspan><tspan x=\"24\" dy=\"20.25\">records. Keep the existing XP rules.</tspan></text><text x=\"24\" y=\"464\" fill=\"#B4ACBD\" font-family=\"Inter,Arial,sans-serif\" font-size=\"15\" font-weight=\"400\"><tspan x=\"24\" dy=\"0\">Avoid sticky-button overlap with</tspan><tspan x=\"24\" dy=\"20.25\">scrolling rows. Leave space for iPhone</tspan><tspan x=\"24\" dy=\"20.25\">safe areas and the keyboard.</tspan></text><text x=\"24\" y=\"564\" fill=\"#B4ACBD\" font-family=\"Inter,Arial,sans-serif\" font-size=\"15\" font-weight=\"400\"><tspan x=\"24\" dy=\"0\">Use visible text with color indicators.</tspan><tspan x=\"24\" dy=\"20.25\">Exercise people stay light on dark tiles;</tspan><tspan x=\"24\" dy=\"20.25\">equipment can carry the accent.</tspan></text><text x=\"24\" y=\"674\" fill=\"#B4ACBD\" font-family=\"Inter,Arial,sans-serif\" font-size=\"15\" font-weight=\"400\"><tspan x=\"24\" dy=\"0\">Confirm workout completion, destructive</tspan><tspan x=\"24\" dy=\"20.25\">changes and unsaved exits. Do not invent</tspan><tspan x=\"24\" dy=\"20.25\">nutrition or activity data.</tspan></text></svg>"};let current='today';const select=document.getElementById('screen-select');for(const s of screens){const o=document.createElement('option');o.value=s.id;o.textContent=s.section+' / '+s.name;select.append(o)}select.onchange=()=>show(select.value);function nav(query=''){const root=document.getElementById('nav');root.textContent='';for(const section of [...new Set(screens.map(s=>s.section))]){const matches=screens.filter(s=>s.section===section&&(s.name+' '+s.id).toLowerCase().includes(query.toLowerCase()));if(!matches.length)continue;const h=document.createElement('h2');h.textContent=section;root.append(h);for(const s of matches){const b=document.createElement('button');b.textContent=s.name;b.dataset.screen=s.id;b.className=s.id===current?'active':'';b.onclick=()=>show(s.id);root.append(b)}}}function fit(){const scale=Math.min(1,(window.innerWidth-(window.innerWidth>700?350:28))/390);const safe=Math.max(.5,scale);document.getElementById('phone').style.width=(390*safe)+'px';document.getElementById('phone').style.height=(844*safe)+'px';document.getElementById('screen').style.transform='scale('+safe+')'}function show(id){current=id;const s=screens.find(s=>s.id===id);const root=document.getElementById('screen');root.innerHTML=svgs[id];for(const e of s.elements.filter(e=>e.destination)){const b=document.createElement('button');b.className='tap';b.style.left=e.x+'px';b.style.top=e.y+'px';b.style.width=e.w+'px';b.style.height=e.h+'px';b.setAttribute('aria-label',e.text||('Open '+screens.find(s=>s.id===e.destination).name));b.onclick=()=>show(e.destination);root.append(b)}select.value=id;document.getElementById('caption').textContent=s.section+' / '+s.name;document.getElementById('notes').textContent=s.notes.join(' ');nav(document.getElementById('search').value);fit()}document.getElementById('search').oninput=e=>nav(e.target.value);window.onresize=fit;show('today');</script></html>
