<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>Enter barcode</title><rect width="390" height="844" fill="#080808"/><text x="24" y="31" fill="#F7F5FA" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600"><tspan x="24" dy="0">9:41</tspan></text><text x="291" y="29" fill="#F7F5FA" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400"><tspan x="291" dy="0">▂ ▄ ▆ ▰</tspan></text><rect x="24" y="51" width="130" height="38" rx="12" fill="#252326"/><text x="89.0" y="75.0" text-anchor="middle" fill="#DF43FF" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600">‹ Back</text><text x="24" y="128" fill="#F7F5FA" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="600"><tspan x="24" dy="0">Enter barcode</tspan></text><rect x="135" y="827" width="120" height="5" rx="3" fill="#E9E5EC"/><text x="24" y="196" fill="#B4ACBD" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400"><tspan x="24" dy="0">UPC or EAN · 8–14 digits</tspan></text><rect x="24" y="207" width="342" height="44" rx="9" fill="#252326"/><text x="36" y="233" fill="#F7F5FA" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400"><tspan x="36" dy="0">3017620422003</tspan></text><text x="24" y="306" fill="#B4ACBD" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400"><tspan x="24" dy="0">Product records may be incomplete. Always review</tspan><tspan x="24" dy="16.200000000000003">the label before logging.</tspan></text><rect x="0" y="746" width="390" height="72" rx="0" fill="#080808"/><rect x="24" y="758" width="342" height="48" rx="12" fill="#DF43FF"/><text x="195.0" y="787.0" text-anchor="middle" fill="#090909" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600">Look up food</text></svg>