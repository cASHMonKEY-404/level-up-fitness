<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>Your data</title><rect width="390" height="844" fill="#080808"/><text x="24" y="31" fill="#F7F5FA" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600"><tspan x="24" dy="0">9:41</tspan></text><text x="291" y="29" fill="#F7F5FA" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400"><tspan x="291" dy="0">▂ ▄ ▆ ▰</tspan></text><rect x="24" y="51" width="130" height="38" rx="12" fill="#252326"/><text x="89.0" y="75.0" text-anchor="middle" fill="#C7A1FF" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600">‹ Back</text><text x="24" y="128" fill="#F7F5FA" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="600"><tspan x="24" dy="0">Your data</tspan></text><rect x="135" y="827" width="120" height="5" rx="3" fill="#E9E5EC"/><text x="24" y="202" fill="#F7F5FA" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="600"><tspan x="24" dy="0">Saved in this browser</tspan></text><text x="24" y="246" fill="#B4ACBD" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400"><tspan x="24" dy="0">No account or cloud backup is</tspan><tspan x="24" dy="21.6">connected. Clearing browser storage</tspan><tspan x="24" dy="21.6">can erase your entries. Another</tspan><tspan x="24" dy="21.6">browser or preview address has</tspan><tspan x="24" dy="21.6">separate data.</tspan></text><text x="24" y="407" fill="#B4ACBD" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400"><tspan x="24" dy="0">Food barcode lookup sends the barcode to</tspan><tspan x="24" dy="20.25">the product database. Your workout</tspan><tspan x="24" dy="20.25">history and food log stay on your device.</tspan></text><rect x="0" y="746" width="390" height="72" rx="0" fill="#080808"/><rect x="24" y="758" width="342" height="48" rx="12" fill="#8C32FF"/><text x="195.0" y="787.0" text-anchor="middle" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600">Back to settings</text></svg>