>Carbs #76FF03</tspan></text><rect x="24" y="529" width="44" height="44" rx="11" fill="#F0DF00"/><text x="84" y="556" fill="#F7F5FA" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400"><tspan x="84" dy="0">Fat #F0DF00</tspan></text><text x="24" y="632" fill="#B4ACBD" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400"><tspan x="24" dy="0">Inter: 28 page titles, 20–24 card titles, 14–16</tspan><tspan x="24" dy="16.200000000000003">body, 12 secondary. Two main weights: Regular and</tspan><tspan x="24" dy="16.200000000000003">SemiBold.</tspan></text><text x="24" y="722" fill="#B4ACBD" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400"><tspan x="24" dy="0">24 px side margins · 16 px card radius · 48 px</tspan><tspan x="24" dy="16.200000000000003">primary buttons · 44 px minimum touch target.</tspan></text></svg>