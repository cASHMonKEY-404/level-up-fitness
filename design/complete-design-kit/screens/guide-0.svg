<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>Floor chest press · form</title><rect width="390" height="844" fill="#080808"/><text x="24" y="31" fill="#F7F5FA" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600"><tspan x="24" dy="0">9:41</tspan></text><text x="291" y="29" fill="#F7F5FA" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400"><tspan x="291" dy="0">▂ ▄ ▆ ▰</tspan></text><rect x="24" y="51" width="130" height="38" rx="12" fill="#252326"/><text x="89.0" y="75.0" text-anchor="middle" fill="#76FF03" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600">‹ Back</text><text x="24" y="128" fill="#F7F5FA" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="600"><tspan x="24" dy="0">Floor chest press ·</tspan><tspan x="24" dy="37.800000000000004">form</tspan></text><rect x="135" y="827" width="120" height="5" rx="3" fill="#E9E5EC"/><rect x="24" y="161" width="342" height="190" rx="16" fill="#151515"/><svg x="118" y="174" width="154" height="154" viewBox="0 0 256 256"><title id="title">Floor chest press</title><desc id="desc">Supine chest press with adult-proportioned arms and legs and bent knees.</desc><g id="pictogram"><path d="M131.3 173.806 L159.938 145.168 L176.674 181.058" fill="none" stroke="#E4DFE8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><path d="M131.3 167.806 L157.333 136.781 L174.069 172.671" fill="none" stroke="#E4DFE8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><path d="M86 170.806 L129.3 170.806" fill="none" stroke="#E4DFE8" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path d="M80 174.806 L74.686 144.671 L74.686 116.771" fill="none" stroke="#E4DFE8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M80 166.806 L85.314 136.671 L85.314 108.771" fill="none" stroke="#E4DFE8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><circle cx="57" cy="170.806" r="13" fill="#E4DFE8"/><g transform="translate(74.686 116.771) rotate(0)"><circle cx="0" cy="0" r="6.5" fill="#76FF03"/><path d="M-8 0 L8 0" fill="none" stroke="#76FF03" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(85.314 108.771) rotate(0)"><circle cx="0" cy="0" r="6.5" fill="#76FF03"/><path d="M-8 0 L8 0" fill="none" stroke="#76FF03" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g></g></svg><text x="24" y="405" fill="#F7F5FA" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400"><tspan x="24" dy="0">1. Lie on your back, knees bent.</tspan></text><text x="24" y="475" fill="#F7F5FA" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400"><tspan x="24" dy="0">2. Press the dumbbells above your chest.</tspan></text><text x="24" y="545" fill="#F7F5FA" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400"><tspan x="24" dy="0">3. Lower slowly until upper arms touch</tspan><tspan x="24" dy="20.25">the floor.</tspan></text><text x="24" y="657" fill="#B4ACBD" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400"><tspan x="24" dy="0">Move within a comfortable range. Stop if you feel</tspan><tspan x="24" dy="16.200000000000003">pain.</tspan></text><rect x="0" y="746" width="390" height="72" rx="0" fill="#080808"/><rect x="24" y="758" width="342" height="48" rx="12" fill="#76FF03"/><text x="195.0" y="787.0" text-anchor="middle" fill="#090909" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600">Back to sets</text></svg>