<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>Bicep curl · form</title><rect width="390" height="844" fill="#080808"/><text x="24" y="31" fill="#F7F5FA" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600"><tspan x="24" dy="0">9:41</tspan></text><text x="291" y="29" fill="#F7F5FA" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400"><tspan x="291" dy="0">▂ ▄ ▆ ▰</tspan></text><rect x="24" y="51" width="130" height="38" rx="12" fill="#252326"/><text x="89.0" y="75.0" text-anchor="middle" fill="#76FF03" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600">‹ Back</text><text x="24" y="128" fill="#F7F5FA" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="600"><tspan x="24" dy="0">Bicep curl · form</tspan></text><rect x="135" y="827" width="120" height="5" rx="3" fill="#E9E5EC"/><rect x="24" y="161" width="342" height="190" rx="16" fill="#151515"/><svg x="118" y="174" width="154" height="154" viewBox="0 0 256 256"><title id="title">Bicep curl</title><desc id="desc">Standing curls with elbows beside the torso and proportionate forearms.</desc><g id="pictogram"><path d="M119 144.854 L113.363 184.959 L114.746 224.535" fill="none" stroke="#E4DFE8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><path d="M137 144.854 L142.637 184.959 L141.254 224.535" fill="none" stroke="#E4DFE8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><path d="M128 99.554 L128 142.854" fill="none" stroke="#E4DFE8" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path d="M114 93.554 L108.686 123.689 L101.465 96.739" fill="none" stroke="#E4DFE8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M142 93.554 L147.314 123.689 L154.535 96.739" fill="none" stroke="#E4DFE8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><circle cx="128" cy="70.554" r="13" fill="#E4DFE8"/><g transform="translate(101.465 96.739) rotate(0)"><path d="M-10 0 L10 0" fill="none" stroke="#76FF03" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M-11-7V7 M11-7V7" fill="none" stroke="#76FF03" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-16-4V4 M16-4V4" fill="none" stroke="#76FF03" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(154.535 96.739) rotate(0)"><path d="M-10 0 L10 0" fill="none" stroke="#76FF03" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M-11-7V7 M11-7V7" fill="none" stroke="#76FF03" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-16-4V4 M16-4V4" fill="none" stroke="#76FF03" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></g></g></svg><text x="24" y="405" fill="#F7F5FA" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400"><tspan x="24" dy="0">1. Stand tall; keep elbows near your</tspan><tspan x="24" dy="20.25">sides.</tspan></text><text x="24" y="475" fill="#F7F5FA" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400"><tspan x="24" dy="0">2. Curl the dumbbells without swinging.</tspan></text><text x="24" y="545" fill="#F7F5FA" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400"><tspan x="24" dy="0">3. Lower slowly and keep wrists</tspan><tspan x="24" dy="20.25">comfortable.</tspan></text><text x="24" y="657" fill="#B4ACBD" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400"><tspan x="24" dy="0">Move within a comfortable range. Stop if you feel</tspan><tspan x="24" dy="16.200000000000003">pain.</tspan></text><rect x="0" y="746" width="390" height="72" rx="0" fill="#080808"/><rect x="24" y="758" width="342" height="48" rx="12" fill="#76FF03"/><text x="195.0" y="787.0" text-anchor="middle" fill="#090909" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600">Back to sets</text></svg>