<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>Goblet squat · form</title><rect width="390" height="844" fill="#080808"/><text x="24" y="31" fill="#F7F5FA" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600"><tspan x="24" dy="0">9:41</tspan></text><text x="291" y="29" fill="#F7F5FA" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400"><tspan x="291" dy="0">▂ ▄ ▆ ▰</tspan></text><rect x="24" y="51" width="130" height="38" rx="12" fill="#252326"/><text x="89.0" y="75.0" text-anchor="middle" fill="#76FF03" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600">‹ Back</text><text x="24" y="128" fill="#F7F5FA" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="600"><tspan x="24" dy="0">Goblet squat · form</tspan></text><rect x="135" y="827" width="120" height="5" rx="3" fill="#E9E5EC"/><rect x="24" y="161" width="342" height="190" rx="16" fill="#151515"/><svg x="118" y="174" width="154" height="154" viewBox="0 0 256 256"><title id="title">Goblet squat</title><desc id="desc">Squat with a kettlebell held at the chest; limbs retain their adult proportions.</desc><g id="pictogram"><defs><mask id="goblet-equipment-space" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256"><rect width="256" height="256" fill="white"/><g color="black"><g transform="translate(128 133.283)"><path d="M-7-7V-15Q0-24 7-15V-7" fill="none" stroke="#76FF03" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M-7-8Q-15 1-9 9Q0 15 9 9Q15 1 7-8Z" fill="#76FF03" stroke="#76FF03" stroke-width="5"/></g></g></mask></defs><g mask="url(#goblet-equipment-space)"><path d="M119 159.583 L83.926 179.833 L77.05 218.832" fill="none" stroke="#E4DFE8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><path d="M137 159.583 L172.074 179.833 L178.95 218.832" fill="none" stroke="#E4DFE8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><path d="M128 114.283 L128 157.583" fill="none" stroke="#E4DFE8" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path d="M114 108.283 L106.426 137.931 L121.7 114.583" fill="none" stroke="#E4DFE8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M142 108.283 L149.574 137.931 L134.3 114.583" fill="none" stroke="#E4DFE8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><circle cx="128" cy="85.283" r="13" fill="#E4DFE8"/></g><g transform="translate(128 133.283)"><path d="M-7-7V-15Q0-24 7-15V-7" fill="none" stroke="#76FF03" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-7-8Q-15 1-9 9Q0 15 9 9Q15 1 7-8Z" fill="#76FF03"/></g></g></svg><text x="24" y="405" fill="#F7F5FA" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400"><tspan x="24" dy="0">1. Hold the kettlebell close to your</tspan><tspan x="24" dy="20.25">chest.</tspan></text><text x="24" y="475" fill="#F7F5FA" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400"><tspan x="24" dy="0">2. Sit hips back and bend your knees.</tspan></text><text x="24" y="545" fill="#F7F5FA" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400"><tspan x="24" dy="0">3. Stand tall through a comfortable</tspan><tspan x="24" dy="20.25">depth.</tspan></text><text x="24" y="657" fill="#B4ACBD" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400"><tspan x="24" dy="0">Move within a comfortable range. Stop if you feel</tspan><tspan x="24" dy="16.200000000000003">pain.</tspan></text><rect x="0" y="746" width="390" height="72" rx="0" fill="#080808"/><rect x="24" y="758" width="342" height="48" rx="12" fill="#76FF03"/><text x="195.0" y="787.0" text-anchor="middle" fill="#090909" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600">Back to sets</text></svg>