<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>Kettlebell deadlift · form</title><rect width="390" height="844" fill="#080808"/><text x="24" y="31" fill="#F7F5FA" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600"><tspan x="24" dy="0">9:41</tspan></text><text x="291" y="29" fill="#F7F5FA" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400"><tspan x="291" dy="0">▂ ▄ ▆ ▰</tspan></text><rect x="24" y="51" width="130" height="38" rx="12" fill="#252326"/><text x="89.0" y="75.0" text-anchor="middle" fill="#76FF03" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600">‹ Back</text><text x="24" y="128" fill="#F7F5FA" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="600"><tspan x="24" dy="0">Kettlebell deadlift ·</tspan><tspan x="24" dy="37.800000000000004">form</tspan></text><rect x="135" y="827" width="120" height="5" rx="3" fill="#E9E5EC"/><rect x="24" y="161" width="342" height="190" rx="16" fill="#151515"/><svg x="118" y="174" width="154" height="154" viewBox="0 0 256 256"><title id="title">Kettlebell deadlift</title><desc id="desc">Deep hip hinge holding a kettlebell low between the feet.</desc><g id="pictogram"><path d="M108.296 159.812 L128.546 194.886 L111.811 230.776" fill="none" stroke="#E4DFE8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><path d="M111.113 165.11 L139.751 193.748 L153.295 230.96" fill="none" stroke="#E4DFE8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><path d="M149.702 141.194 L111.471 161.522" fill="none" stroke="#E4DFE8" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path d="M153.122 134.846 L148.335 165.069 L143.971 192.625" fill="none" stroke="#E4DFE8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M156.878 141.909 L152.091 172.132 L147.726 199.689" fill="none" stroke="#E4DFE8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><circle cx="175.308" cy="127.579" r="13" fill="#E4DFE8"/><g transform="translate(145.849 215.157)"><path d="M-7-7V-15Q0-24 7-15V-7" fill="none" stroke="#76FF03" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-7-8Q-15 1-9 9Q0 15 9 9Q15 1 7-8Z" fill="#76FF03"/></g></g></svg><text x="24" y="405" fill="#F7F5FA" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400"><tspan x="24" dy="0">1. Place the kettlebell between your</tspan><tspan x="24" dy="20.25">feet.</tspan></text><text x="24" y="475" fill="#F7F5FA" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400"><tspan x="24" dy="0">2. Hinge at the hips and grip the handle.</tspan></text><text x="24" y="545" fill="#F7F5FA" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400"><tspan x="24" dy="0">3. Stand with a neutral back, then lower</tspan><tspan x="24" dy="20.25">slowly.</tspan></text><text x="24" y="657" fill="#B4ACBD" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400"><tspan x="24" dy="0">Move within a comfortable range. Stop if you feel</tspan><tspan x="24" dy="16.200000000000003">pain.</tspan></text><rect x="0" y="746" width="390" height="72" rx="0" fill="#080808"/><rect x="24" y="758" width="342" height="48" rx="12" fill="#76FF03"/><text x="195.0" y="787.0" text-anchor="middle" fill="#090909" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600">Back to sets</text></svg>