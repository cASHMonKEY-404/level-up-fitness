<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>Seated band row · form</title><rect width="390" height="844" fill="#080808"/><text x="24" y="31" fill="#F7F5FA" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600"><tspan x="24" dy="0">9:41</tspan></text><text x="291" y="29" fill="#F7F5FA" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400"><tspan x="291" dy="0">▂ ▄ ▆ ▰</tspan></text><rect x="24" y="51" width="130" height="38" rx="12" fill="#252326"/><text x="89.0" y="75.0" text-anchor="middle" fill="#76FF03" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600">‹ Back</text><text x="24" y="128" fill="#F7F5FA" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="600"><tspan x="24" dy="0">Seated band row · form</tspan></text><rect x="135" y="827" width="120" height="5" rx="3" fill="#E9E5EC"/><rect x="24" y="161" width="342" height="190" rx="16" fill="#151515"/><svg x="118" y="174" width="154" height="154" viewBox="0 0 256 256"><title id="title">Band row</title><desc id="desc">Seated band row with naturally extended legs and flexed elbows.</desc><g id="pictogram"><path d="M102.1 150.981 L158.706 172.418 L161.706 181.418 L103 156.381" fill="none" stroke="#E4DFE8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M73 170.781 L113.106 176.418 L152.706 176.418" fill="none" stroke="#E4DFE8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><path d="M79 170.781 L118.885 177.814 L158.485 177.814" fill="none" stroke="#E4DFE8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><path d="M76 125.481 L76 168.781" fill="none" stroke="#E4DFE8" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path d="M72 119.481 L74.217 150.001 L102.1 150.981" fill="none" stroke="#E4DFE8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M80 119.481 L75.886 149.804 L103 156.381" fill="none" stroke="#E4DFE8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><circle cx="76" cy="96.481" r="13" fill="#E4DFE8"/></g></svg><text x="24" y="405" fill="#F7F5FA" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400"><tspan x="24" dy="0">1. Loop an intact band securely around</tspan><tspan x="24" dy="20.25">your feet.</tspan></text><text x="24" y="475" fill="#F7F5FA" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400"><tspan x="24" dy="0">2. Sit tall and pull elbows toward your</tspan><tspan x="24" dy="20.25">ribs.</tspan></text><text x="24" y="545" fill="#F7F5FA" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400"><tspan x="24" dy="0">3. Release slowly; keep the band away</tspan><tspan x="24" dy="20.25">from your face.</tspan></text><text x="24" y="657" fill="#B4ACBD" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400"><tspan x="24" dy="0">Move within a comfortable range. Stop if you feel</tspan><tspan x="24" dy="16.200000000000003">pain.</tspan></text><rect x="0" y="746" width="390" height="72" rx="0" fill="#080808"/><rect x="24" y="758" width="342" height="48" rx="12" fill="#76FF03"/><text x="195.0" y="787.0" text-anchor="middle" fill="#090909" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600">Back to sets</text></svg>