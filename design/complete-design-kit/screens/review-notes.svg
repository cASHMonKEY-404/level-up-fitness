<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>Review &amp; implementation notes</title><rect width="390" height="844" fill="#080808"/><text x="24" y="31" fill="#F7F5FA" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600"><tspan x="24" dy="0">9:41</tspan></text><text x="291" y="29" fill="#F7F5FA" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400"><tspan x="291" dy="0">▂ ▄ ▆ ▰</tspan></text><text x="24" y="128" fill="#F7F5FA" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="600"><tspan x="24" dy="0">Review &amp;</tspan><tspan x="24" dy="37.800000000000004">implementation notes</tspan></text><rect x="135" y="827" width="120" height="5" rx="3" fill="#E9E5EC"/><text x="24" y="179" fill="#B4ACBD" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400"><tspan x="24" dy="0">All screen values are coherent sample</tspan><tspan x="24" dy="20.25">data, not the user’s tracked records.</tspan></text><text x="24" y="264" fill="#B4ACBD" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400"><tspan x="24" dy="0">This is a clickable design prototype.</tspan><tspan x="24" dy="20.25">Fields and calculations become</tspan><tspan x="24" dy="20.25">interactive during implementation.</tspan></text><text x="24" y="364" fill="#B4ACBD" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400"><tspan x="24" dy="0">Preserve local workout, meal, step and XP</tspan><tspan x="24" dy="20.25">records. Keep the existing XP rules.</tspan></text><text x="24" y="464" fill="#B4ACBD" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400"><tspan x="24" dy="0">Avoid sticky-button overlap with</tspan><tspan x="24" dy="20.25">scrolling rows. Leave space for iPhone</tspan><tspan x="24" dy="20.25">safe areas and the keyboard.</tspan></text><text x="24" y="564" fill="#B4ACBD" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400"><tspan x="24" dy="0">Use visible text with color indicators.</tspan><tspan x="24" dy="20.25">Exercise people stay light on dark tiles;</tspan><tspan x="24" dy="20.25">equipment can carry the accent.</tspan></text><text x="24" y="674" fill="#B4ACBD" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400"><tspan x="24" dy="0">Confirm workout completion, destructive</tspan><tspan x="24" dy="20.25">changes and unsaved exits. Do not invent</tspan><tspan x="24" dy="20.25">nutrition or activity data.</tspan></text></svg>