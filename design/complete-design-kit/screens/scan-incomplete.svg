<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>Some values are missing</title><rect width="390" height="844" fill="#080808"/><text x="24" y="31" fill="#F7F5FA" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600"><tspan x="24" dy="0">9:41</tspan></text><text x="291" y="29" fill="#F7F5FA" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400"><tspan x="291" dy="0">▂ ▄ ▆ ▰</tspan></text><rect x="24" y="51" width="130" height="38" rx="12" fill="#252326"/><text x="89.0" y="75.0" text-anchor="middle" fill="#DF43FF" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600">‹ Back</text><text x="24" y="128" fill="#F7F5FA" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="600"><tspan x="24" dy="0">Some values are</tspan><tspan x="24" dy="37.800000000000004">missing</tspan></text><rect x="135" y="827" width="120" height="5" rx="3" fill="#E9E5EC"/><rect x="24" y="182" width="342" height="207" rx="16" fill="#151515"/><text x="42" y="222" fill="#F7F5FA" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400"><tspan x="42" dy="0">Calories and protein were found,</tspan><tspan x="42" dy="22.950000000000003">but carbohydrate and fat</tspan><tspan x="42" dy="22.950000000000003">information is missing. Review</tspan><tspan x="42" dy="22.950000000000003">your label; missing values stay</tspan><tspan x="42" dy="22.950000000000003">unknown.</tspan></text><rect x="24" y="445" width="342" height="48" rx="12" fill="#252326"/><text x="195.0" y="474.0" text-anchor="middle" fill="#DF43FF" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600">Try again</text><rect x="0" y="746" width="390" height="72" rx="0" fill="#080808"/><rect x="24" y="758" width="342" height="48" rx="12" fill="#DF43FF"/><text x="195.0" y="787.0" text-anchor="middle" fill="#090909" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600">Review food</text></svg>