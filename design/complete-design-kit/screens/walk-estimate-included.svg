<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>Estimated steps</title><rect width="390" height="844" fill="#080808"/><text x="24" y="31" fill="#F7F5FA" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600"><tspan x="24" dy="0">9:41</tspan></text><text x="291" y="29" fill="#F7F5FA" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400"><tspan x="291" dy="0">▂ ▄ ▆ ▰</tspan></text><rect x="24" y="51" width="130" height="38" rx="12" fill="#252326"/><text x="89.0" y="75.0" text-anchor="middle" fill="#C7A1FF" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600">‹ Back</text><text x="24" y="128" fill="#F7F5FA" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="600"><tspan x="24" dy="0">Estimated steps</tspan></text><rect x="135" y="827" width="120" height="5" rx="3" fill="#E9E5EC"/><rect x="24" y="162" width="342" height="148" rx="16" fill="#151515"/><text x="42" y="193" fill="#B4ACBD" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400"><tspan x="42" dy="0">ESTIMATE · NOT A DEVICE COUNT</tspan></text><text x="42" y="252" fill="#F7F5FA" font-family="Inter,Arial,sans-serif" font-size="40" font-weight="600"><tspan x="42" dy="0">≈ 6,200</tspan></text><text x="42" y="283" fill="#B4ACBD" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400"><tspan x="42" dy="0">2.74 miles ÷ 28-inch step length</tspan></text><text x="24" y="349" fill="#B4ACBD" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400"><tspan x="24" dy="0">Estimation method</tspan></text><rect x="24" y="360" width="342" height="44" rx="9" fill="#252326"/><text x="36" y="386" fill="#F7F5FA" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400"><tspan x="36" dy="0">Distance &amp; step length ⌄</tspan></text><text x="24" y="443" fill="#B4ACBD" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400"><tspan x="24" dy="0">Step length (inches)</tspan></text><rect x="24" y="454" width="342" height="44" rx="9" fill="#252326"/><text x="36" y="480" fill="#F7F5FA" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400"><tspan x="36" dy="0">28</tspan></text><text x="24" y="531" fill="#B4ACBD" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400"><tspan x="24" dy="0">28 inches is a generic starting estimate. Measure</tspan><tspan x="24" dy="16.200000000000003">your step length or use measured cadence for a more</tspan><tspan x="24" dy="16.200000000000003">personal estimate.</tspan></text><rect x="24" y="603" width="342" height="48" rx="12" fill="#252326"/><text x="195.0" y="632.0" text-anchor="middle" fill="#C7A1FF" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600">☑ Include in daily total</text><text x="24" y="678" fill="#B4ACBD" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400"><tspan x="24" dy="0">Leave off if your phone or tracker already counted</tspan><tspan x="24" dy="16.200000000000003">this walk. Editing replaces the contribution; it is</tspan><tspan x="24" dy="16.200000000000003">not added twice.</tspan></text><rect x="0" y="746" width="390" height="72" rx="0" fill="#080808"/><rect x="24" y="758" width="342" height="48" rx="12" fill="#8C32FF"/><text x="195.0" y="787.0" text-anchor="middle" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600">Save walk · +120 XP</text></svg>